name: Appointment database backup
on:
  schedule:
    - cron: '37 1 * * *'
    - cron: '2 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: appointment-backup-export
  cancel-in-progress: false
jobs:
  export:
    # Evaluated BEFORE runner allocation or protected environment secrets.
    if: github.repository == vars.BOOKING_REPOSITORY && github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && toJSON(github.event.repository.fork) == 'false' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == vars.BOOKING_BACKUP_CRON))
    environment: appointment-backup-export
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            appointment-system
            appointment-settings
      - name: Install pinned backup dependencies and verified age tool
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r appointment-system/requirements.lock
          mkdir -m 700 "$RUNNER_TEMP/appointment-tools"
          bash appointment-system/tools/automation/install-age.sh "$RUNNER_TEMP/appointment-tools"
      - name: Export read-only snapshot and store encrypted copies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOKING_PROFILE: appointment-settings/project.json
          BOOKING_BACKUP_DATABASE_URL: ${{ secrets.BOOKING_BACKUP_DATABASE_URL }}
          BOOKING_BACKUP_DRIVE_WRITER: ${{ secrets.BOOKING_BACKUP_DRIVE_WRITER }}
          BOOKING_BACKUP_AGE_RECIPIENT: ${{ vars.BOOKING_BACKUP_AGE_RECIPIENT }}
          BOOKING_BACKUP_EXPORT_KEY_ID: ${{ vars.BOOKING_BACKUP_EXPORT_KEY_ID }}
          BOOKING_BACKUP_EXPORT_SIGNING_KEY: ${{ secrets.BOOKING_BACKUP_EXPORT_SIGNING_KEY }}
          BOOKING_BACKUP_EXPORT_VERIFY_KEYS: ${{ vars.BOOKING_BACKUP_EXPORT_VERIFY_KEYS }}
          BOOKING_BACKUP_VALIDATION_VERIFY_KEYS: ${{ vars.BOOKING_BACKUP_VALIDATION_VERIFY_KEYS }}
        run: |
          python3 - "$RUNNER_TEMP/appointment-tools/age" <<'PY'
          import contextlib,httpx,runpy,sys,time
          original=httpx.Client.stream
          @contextlib.contextmanager
          def observed(self,method,url,*args,**kwargs):
              parsed=httpx.URL(url)
              stage=('drive-upload-'+str(method).lower()) if parsed.path.startswith('/upload/drive/') else ('google-token' if parsed.host=='oauth2.googleapis.com' else 'drive-read' if parsed.host=='www.googleapis.com' else 'github-read')
              start=time.monotonic()
              print('backup_transfer_start '+stage,flush=True)
              try:
                  with original(self,method,url,*args,**kwargs) as reply:
                      print('backup_transfer_response '+stage+' status='+str(reply.status_code),flush=True)
                      yield reply
              except Exception as error:
                  print('backup_transfer_error '+stage+' type='+type(error).__name__+' elapsed='+str(round(time.monotonic()-start,2)),flush=True)
                  raise
              finally:
                  print('backup_transfer_end '+stage+' elapsed='+str(round(time.monotonic()-start,2)),flush=True)
          httpx.Client.stream=observed
          sys.argv=['appointment-system/tools/automation/backup.py','export','--age-binary',sys.argv[1]]
          runpy.run_path(sys.argv[0],run_name='__main__')
          PY
