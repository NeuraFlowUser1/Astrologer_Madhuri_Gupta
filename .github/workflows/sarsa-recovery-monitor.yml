name: Sarsa recovery monitor

on:
  schedule:
    # Recovery: 00,15,30,45. Observer: eight minutes later, with no Neon read.
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sarsa-recovery-monitor
  cancel-in-progress: false

jobs:
  observe:
    # Standard public-repository runners do not consume private-plan minutes.
    # Missing metadata, a private repository or a fork must not allocate a runner.
    if: github.repository == 'NeuraFlowUser1/Astrologer_Madhuri_Gupta' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read the checked-in observer only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-09-29
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: workers/booking-recovery/monitor.mjs
      - name: Check the Cloudflare recovery signal
        run: node workers/booking-recovery/monitor.mjs
