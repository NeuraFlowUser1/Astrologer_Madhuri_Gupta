name: Sarsa encrypted daily backup
on:
  schedule:
    - cron: '2 3 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: Daily copy or a fresh current-release checkpoint
        required: true
        default: daily
        type: choice
        options: [daily, checkpoint]
permissions:
  contents: read
concurrency:
  group: sarsa-encrypted-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'NeuraFlowUser1/Astrologer_Madhuri_Gupta' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install reviewed backup dependencies
        run: |
          python3 -m venv /tmp/sarsa-backup-venv
          /tmp/sarsa-backup-venv/bin/pip install -r tools/backup/requirements.txt
          docker pull postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
      - name: Check backup helpers with synthetic data
        run: /tmp/sarsa-backup-venv/bin/python -m unittest discover -s tools/backup -p 'test_*.py'
      - name: Encrypt, restore-check and save Sarsa backup
        env:
          SARSA_BACKUP_KIND: ${{ inputs.kind || 'daily' }}
          SARSA_BACKUP_DATABASE_URL: ${{ secrets.SARSA_BACKUP_DATABASE_URL }}
          SARSA_BACKUP_ENCRYPTION_KEY: ${{ secrets.SARSA_BACKUP_ENCRYPTION_KEY }}
          SARSA_BACKUP_GOOGLE: ${{ secrets.SARSA_BACKUP_GOOGLE }}
        run: /tmp/sarsa-backup-venv/bin/python tools/backup/run.py
